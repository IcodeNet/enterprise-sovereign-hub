<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="icodeNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="icodeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Outer orbit ring: represents a network / connected intelligence -->
  <circle cx="110" cy="110" r="96" fill="none" stroke="url(#icodeRingGrad)" stroke-width="2" stroke-dasharray="6,8" opacity="0.55"/>

  <!-- Hexagonal "circuit brain" core: code + intelligence -->
  <polygon points="110,30 177,68 177,152 110,190 43,152 43,68"
           fill="rgba(15,23,42,0.9)" stroke="url(#icodeNodeGrad)" stroke-width="2.5"/>

  <!-- Circuit traces inside the hexagon, converging on a central node -->
  <g stroke="#67e8f9" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M110,30 L110,70"/>
    <path d="M177,68 L140,90"/>
    <path d="M177,152 L140,130"/>
    <path d="M110,190 L110,150"/>
    <path d="M43,152 L80,130"/>
    <path d="M43,68 L80,90"/>
  </g>

  <!-- Small terminal nodes at each circuit endpoint -->
  <g fill="#22d3ee">
    <circle cx="110" cy="70" r="4"/>
    <circle cx="140" cy="90" r="4"/>
    <circle cx="140" cy="130" r="4"/>
    <circle cx="110" cy="150" r="4"/>
    <circle cx="80" cy="130" r="4"/>
    <circle cx="80" cy="90" r="4"/>
  </g>

  <!-- Central "iC" monogram: i for intelligence, C for code -->
  <text x="110" y="122" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="42" font-weight="700"
        fill="#f8fafc" text-anchor="middle">i<tspan fill="url(#icodeNodeGrad)">C</tspan></text>

  <!-- Pulsing core dot: the "always-on" agent -->
  <circle cx="110" cy="110" r="5" fill="#f8fafc" opacity="0.9"/>
</svg>
