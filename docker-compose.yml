version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - sovereign-net

  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: sovereign-ai-engine
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - sovereign-net

networks:
  sovereign-net:
    driver: bridge

volumes:
  qdrant_storage:
